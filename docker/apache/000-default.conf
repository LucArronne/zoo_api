<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/symfony/public

    <Directory /var/www/symfony/public>
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{HTTPS} !=on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</VirtualHost>

<VirtualHost *:443>
    ServerName localhost
    DocumentRoot /var/www/symfony/public

    SSLEngine on
    SSLCertificateFile /etc/apache2/ssl/symfony.crt
    SSLCertificateKeyFile /etc/apache2/ssl/symfony.key

    <Directory /var/www/symfony/public>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>